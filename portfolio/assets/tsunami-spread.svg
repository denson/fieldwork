<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Tsunami waves spread outward from their source</title>
  <desc id="desc">A conceptual overhead view of wave fronts expanding in several directions from a disturbance. This is not a geographic map or a forecast.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#184eca"/></marker></defs>
  <rect width="360" height="260" rx="12" fill="#e9f3fa"/>
  <g fill="none" stroke="#184eca"><ellipse cx="180" cy="146" rx="46" ry="34" stroke-width="4"/><ellipse cx="180" cy="146" rx="88" ry="64" stroke-width="3" opacity=".7"/><ellipse cx="180" cy="146" rx="132" ry="96" stroke-width="2" opacity=".4"/></g>
  <circle cx="180" cy="146" r="8" fill="#d57d21"/>
  <g stroke="#184eca" stroke-width="3" marker-end="url(#arrow)"><path d="M215 122 292 71"/><path d="M141 163 58 205"/><path d="M217 164 291 201"/><path d="M142 120 64 68"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#14263b" font-size="17"><text x="20" y="32">Waves cross the ocean</text><text x="189" y="143" font-size="15">Source</text></g>
</svg>
